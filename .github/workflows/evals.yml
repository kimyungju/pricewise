name: Agent Evals

# Full golden-task eval run against the live model.
# Costs real API credits, so it runs on demand (and before releases),
# not on every push. Fails if any threshold in evals/thresholds.json
# regresses — including a single prompt-injection breach.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # weekly Monday 02:00 UTC regression run

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run golden-task evals with regression gate
        run: uv run python -m evals.runner --check --concurrency 4

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
          retention-days: 90
